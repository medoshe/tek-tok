<html lang="ar" dir="rtl">
<head>

<title>أذكار الصباح والمساء</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;overflow-y:scroll}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tajawal,system-ui,sans-serif;min-height:100%;color:#7a571b;background:#d6ae5e}
body.n{color:#e9ecff;background:#10183f}
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sky>i{position:absolute;inset:0;transition:opacity .8s}
.day{background:linear-gradient(#f4e3bc,#f2dcab 35%,#e0bd70 75%,#d4ac5b)}
.night{background:linear-gradient(#060b20,#10183f 55%,#1f2c64);opacity:0}
body.n .night{opacity:1}
body.n .day{opacity:0}
.sun,.moon{position:absolute;left:85%;top:197px;width:136px;height:136px;margin:-68px 0 0 -68px;transition:transform .7s ease-in-out,opacity .5s ease-in-out}
.sun{border-radius:50%;background:radial-gradient(circle at 36% 30%,#fffde9,#fff0a6 32%,#fde68a 64%,#f5d36b);box-shadow:inset -8px -10px 24px #f0c85a77,0 0 40px 10px #fff2b04d}
.sun:before{content:"";position:absolute;inset:-26%;background:repeating-conic-gradient(from 12deg,#fff6 0 6deg,transparent 6deg 30deg);-webkit-mask:radial-gradient(circle closest-side,transparent 68%,#000 69%,#000 94.5%,transparent 95.5%);mask:radial-gradient(circle closest-side,transparent 68%,#000 69%,#000 94.5%,transparent 95.5%);filter:blur(.3px);animation:rot 90s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.moon{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8ecff 55%,#c9d3f5);box-shadow:0 0 40px 12px #c4ceff66,0 0 110px 40px #8fa1ff33;transform:rotate(-90deg);opacity:0}
.moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 24% 25%,#c3cdf0 7%,transparent 8%),radial-gradient(circle at 52% 36%,#c3cdf0 10%,transparent 11%),radial-gradient(circle at 30% 62%,#c3cdf0 8%,transparent 9%)}
body.n .sun{transform:rotate(90deg);opacity:0}
body.n .moon{transform:none;opacity:1}
.cl{position:absolute;border-radius:3em;background:linear-gradient(#fffefa,#f1e7d2);box-shadow:0 12px 30px #8a5a1022;opacity:.92;transition:opacity .6s;animation:fl 28s ease-in-out infinite alternate}
.cl:before,.cl:after{content:"";position:absolute;border-radius:50%;background:inherit}
.cl:before{width:10em;height:10em;left:3.5em;top:-4.4em}
.cl:after{width:7.4em;height:7.4em;right:4em;top:-2.8em}
.c1{left:6%;top:112px;width:24em;height:6em;font-size:10px}
.c2{left:60%;top:258px;width:24em;height:6em;font-size:7.3px}
.c3{left:11%;top:458px;width:24em;height:6em;font-size:8.7px}
body.n .cl{opacity:0}
@keyframes fl{to{transform:translateX(40px)}}
.st{position:absolute;border-radius:50%;background:#fff;opacity:0;transition:opacity .8s}
body.n .st{opacity:1;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:80px 18px 40px}
.tg{display:flex;position:relative;padding:5px;border-radius:40px;background:#f9f1de;box-shadow:inset 0 0 0 2px #ffffffd0,0 10px 24px #9a6e1f2e}
body.n .tg{background:#ffffff1c;box-shadow:0 0 0 1px #ffffff30,0 8px 22px #0006}
.tg button{position:relative;z-index:1;width:52px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8a7a5a;transition:color .5s}
body.n .tg button{color:#9fabe0}
body:not(.n) #bm,body.n #bn{color:#e6a93b}
.tg svg{width:21px;height:21px;display:block}
.tg b{position:absolute;top:5px;right:7px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 6px 16px #8a6a2a30,-4px 2px 14px #b49b6a40;transition:transform .5s cubic-bezier(.6,0,.3,1)}
body.n .tg b{transform:translateX(-52px)}
button:focus-visible{outline:3px solid #f0a21c;outline-offset:3px}
h1{margin-top:30px;font:800 clamp(38px,9vw,56px)/1.3 Cairo,sans-serif;color:#7a571b;text-shadow:0 4px 22px #fff7;text-align:center}
body.n h1{color:transparent;background:linear-gradient(#fff,#c6cffa);-webkit-background-clip:text;background-clip:text;text-shadow:none}
.sub{margin-top:16px;font-size:15px;font-weight:500;color:#7a6540}
body.n .sub{color:#9aa6d6}
.pr{margin-top:34px;display:flex;direction:ltr;align-items:center;gap:14px;width:min(544px,100%)}
.pc{min-width:59px;height:30px;border-radius:16px;background:#2a241a;color:#fff;font:800 12px/30px Tajawal,sans-serif;text-align:center;box-shadow:0 4px 10px #0003}
body.n .pc{background:#eef0ff;color:#10183a}
.bar{position:relative;flex:1;height:15px;border-radius:10px;background:#ebe2cd;border:1.5px solid #fffaf0;box-shadow:inset 0 1px 3px #8a6a2a22;overflow:hidden}
body.n .bar{background:#ffffff1f;border-color:#ffffff30}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:10px;background:linear-gradient(90deg,#5b7b5a,#9fb48f 25%,#e8b24a 50%,#b9b872 75%,#5b7b5a);background-size:200% 100%;animation:flow 7s linear infinite;transition:width .9s cubic-bezier(.3,.9,.3,1);overflow:hidden}
.fill:after{content:"";position:absolute;top:0;bottom:0;left:-56px;width:56px;background:linear-gradient(90deg,#fff0,#ffffff80 35%,#fff 50%,#ffffff80 65%,#fff0);animation:sh 3s ease-in-out infinite}
@keyframes sh{0%{left:-56px}65%,100%{left:100%}}
@keyframes flow{to{background-position:-200% 0}}
.slot{width:min(736px,100%);margin-top:34px}
.card{width:100%;border-radius:42px;padding:54px 44px 50px;text-align:center;background:linear-gradient(#fffdf9,#fbedd0);box-shadow:0 26px 60px #7a4a1033}
body.n .card{background:linear-gradient(#616679e0,#4f556ae0 56px,#141b36e0 125px,#141b36e0);box-shadow:0 0 0 1px #4c5a9199,0 26px 60px #0008}
.fd{transition:opacity .35s,transform .35s}
.fd.o{opacity:0;transform:translateY(10px)}
#tx{font:400 clamp(22px,5vw,29px)/2.4 Amiri,serif;color:#2a241a}
body.n #tx{color:#f4f5ff}
.go{margin-top:30px;width:176px;height:56px;padding:0;border:0;border-radius:30px;font:700 20px Tajawal,sans-serif;color:#fff;background:#2a241a;box-shadow:0 12px 26px #2a241a55;cursor:pointer;transition:transform .15s,opacity .25s}
body.n .go{background:#eef0ff;color:#10183a;box-shadow:0 12px 26px #0006}
.go:active{transform:scale(.94)}
.go.off{opacity:.62;pointer-events:none;transform:none}
.go b{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;margin-inline-start:12px;border-radius:14px;background:#e8b24a;color:#2a241a;font:800 14px Tajawal,sans-serif;vertical-align:middle}
.hint{margin-top:26px;min-height:24px;font-size:15px;color:#7a6540;text-align:center}
body.n .hint{color:#a4aedd}
.hint b{color:#f0a21c;margin-inline-end:8px}
footer{margin-top:auto;padding-top:60px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
footer h3{font:400 26px Amiri,serif;opacity:.85}
.pill{padding:14px 28px;border-radius:30px;background:#efe0bd;border:2px solid #fff9;font-weight:700;font-size:15px;line-height:1.7;color:#6b4410}
body.n .pill{background:#ffffff14;border-color:#ffffff33;color:#e3e7ff}
footer small{font-size:13px;color:#7a6540cc}
body.n footer small{color:#9aa6d6}
.pop{position:fixed;left:0;top:0;z-index:20;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbe3a3,#f0c462 65%,#e8b24a);opacity:.95;box-shadow:0 0 10px 3px #f0c46a88;pointer-events:none;will-change:transform}
@media(max-width:600px){main{padding-top:60px}.card{padding:40px 22px 34px;border-radius:32px}.sun,.moon{width:84px;height:84px;margin:-42px 0 0 -42px;top:110px;left:80%}.c1{top:90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>

<script>
var D=[
["اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾",1,"آية الكرسي: من قالها حين {يصبح|يمسي} أجير من الجن حتى {يمسي|يصبح}.",1],
["آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٨٦﴾",1,"الآيتان من آخر سورة البقرة: من قرأهما في ليلة كفتاه.",1,2],
["قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾",3,"سورة الإخلاص: تعدل ثلث القرآن.",1],
["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾",3,"سورة الفلق: إحدى المعوذتين، من قرأها مع الإخلاص والناس كفته من كل شيء.",1],
["قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾",3,"سورة الناس: إحدى المعوذتين، من قرأها مع الإخلاص والفلق كفته من كل شيء.",1],
["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.",1,"سيد الاستغفار: من قالها موقنًا بها حين {يصبح|يمسي} فمات من {يومه|ليلته} دخل الجنة."],
["{أَصْبَحْنَا|أَمْسَيْنَا} وَ{أَصْبَحَ|أَمْسَى} الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي {هَٰذَا الْيَوْمِ|هَٰذِهِ اللَّيْلَةِ} وَخَيْرَ مَا {بَعْدَهُ|بَعْدَهَا}، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي {هَٰذَا الْيَوْمِ|هَٰذِهِ اللَّيْلَةِ} وَشَرِّ مَا {بَعْدَهُ|بَعْدَهَا}، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.",1,""],
["اللَّهُمَّ بِكَ {أَصْبَحْنَا|أَمْسَيْنَا}، وَبِكَ {أَمْسَيْنَا|أَصْبَحْنَا}، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ {النُّشُورُ|الْمَصِيرُ}.",1,""],
["{أَصْبَحْنَا|أَمْسَيْنَا} عَلَى فِطْرَةِ الْإِسْلَامِ، وَكَلِمَةِ الْإِخْلَاصِ، وَدِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَمِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.",1,""],
["اللَّهُمَّ مَا {أَصْبَحَ|أَمْسَى} بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.",1,"من قالها حين {يصبح|يمسي} فقد أدّى شكر {يومه|ليلته}."],
["اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ.",3,""],

["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.",3,"من قالها ثلاثًا كان حقًّا على الله أن يُرضيه يوم القيامة."],
